[package]
name = "aygent"
version = "0.0.1"
description = "The AI agent you actually own"
authors = ["Mason Tompkins"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aygent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"          # native folder picker (M0.2)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"                       # per-session WS token (Atlas C6)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros"] }  # async command + broker WS
tokio-tungstenite = "0.24"         # Rust-hosted broker WS server (M0.2b)
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native"] }  # API keys in macOS Keychain (M0.3; never touch JS/WebView)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }  # Anthropic HTTP (M0.3)
git2 = { version = "0.19", default-features = false }  # checkpoints (C4): git object model compiled IN — no system git, zero user setup

[target.'cfg(unix)'.dependencies]
libc = "0.2"                        # atomic openat/O_NOFOLLOW fd layer (M0.2c)

[target.'cfg(target_os = "macos")'.dependencies]
# scoped-bookmark + security-scoped resource access goes through objc2 bindings;
# added when we wire bookmark persistence (deferred Phase-1 polish).

[features]
custom-protocol = ["tauri/custom-protocol"]
