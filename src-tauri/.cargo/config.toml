# Windows: link the C/C++ runtime statically, so the app runs on a clean
# Windows without the Visual C++ Redistributable (MSVCP140.dll and friends).
# Rust and cc-built C code follow +crt-static; llama.cpp (CMake) needs
# LLAMA_STATIC_CRT and the toolchain file cmake/msvc-static-crt.cmake
# (Windows targets only). CI checks the built exe (scripts/check-win-imports.mjs).
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[env]
LLAMA_STATIC_CRT = "1"
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true }
