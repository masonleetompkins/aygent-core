name: matrix (1.1.0)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            bundles: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi
            bundles: msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            bundles: appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps (WebKitGTK/GTK3)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: UI build
        run: npm ci --prefix ui && npm run build --prefix ui
      - name: Daemon build
        run: npm ci --prefix daemon && npm run build --prefix daemon
      - name: Rust checks
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Rust tests (lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Tauri build (unsigned dev)
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: src-tauri
      - name: sha256 + upload
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          # Hash files only (AppDir/.app are directories; macOS lacks sha256sum).
          if command -v sha256sum >/dev/null; then
            find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -exec sha256sum {} + > sha256-${{ matrix.bundle }}.txt
          else
            find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -exec shasum -a 256 {} + > sha256-${{ matrix.bundle }}.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aygent-${{ github.ref_name }}-${{ matrix.bundle }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  changelog-gate:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: tag must have a changelog entry
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "$TAG" CHANGELOG.md || { echo "no $TAG entry in CHANGELOG.md"; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-clean:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: no proprietary surfaces in Core
        shell: bash
        run: |
          # Exact proprietary identifiers only (plain-English prose never matches).
          PAT='resolve_subscription|subscription_display|managed_session|signin_|pro_status|pro_refresh|refresh_entitlement|tier_lock|included_cents|paid_cents|desktop-signin|api/entitlement|screens/Dashboard|screens/Sparks|screens/Video|screens/video/|Subscription \(Pro|Pro credits|Pro seat|subscription tier'
          if grep -rn -iE "$PAT" --exclude-dir=.git --exclude-dir=target --exclude-dir=node_modules --exclude-dir=dist --exclude=matrix.yml .; then
            echo "core-clean gate FAILED: proprietary marker above"; exit 1
          fi
          echo "core-clean OK"
